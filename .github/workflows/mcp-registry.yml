name: Publish to MCP Registry

# Run by hand after approving the staged release:
#   gh workflow run mcp-registry.yml --ref main
# The registry reads the published package version, so an unapproved version fails here.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry, no stored secret
    env:
      # Bump the version and the SHA-256 below together (from the release's checksums.txt).
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
